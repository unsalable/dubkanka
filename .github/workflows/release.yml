# Push a tag like v1.2.0 (scripts/release.ps1 does it): Windows builds DubKanka-Setup.exe and publishes it with
# latest.yml to a GitHub release. The installer keeps one name in every release (the version is in the release title
# and in its download path), so .../releases/latest/download/DubKanka-Setup.exe is always the newest one. Installed
# apps read latest.yml and update themselves.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # the release exists before electron-builder uploads in parallel, otherwise each upload creates its own
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "DubKanka ${GITHUB_REF_NAME#v}" --notes-from-tag

      - name: Build and upload the installer
        run: npm run release

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
