<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; script-src 'self'">
  <title>DubKanka</title>
  <link rel="stylesheet" href="setup.css">
</head>
<body>
  <header class="bar"><img src="icon.svg" alt=""><span class="word">DubKanka</span><span class="ver" id="ver"></span></header>
  <main id="root">
    <section class="starting" id="starting">
      <div class="lane"><i></i></div>
      <p id="startText">Başlatılıyor…</p>
    </section>

    <section class="install" id="install" hidden>
      <h1 id="title">İlk kurulum</h1>
      <p class="lead" id="lead"></p>
      <div class="overall"><div class="track"><i id="bar"></i></div><span class="mono" id="pct">0%</span><span class="mono dim" id="elapsed">0:00</span></div>
      <ol class="steps" id="steps"></ol>
      <div class="actions"><button class="btn" id="skip" hidden>Modelleri sonra indir</button></div>
      <details class="log"><summary>Ayrıntılar</summary><pre id="log"></pre></details>
    </section>

    <section class="error" id="error" hidden>
      <h1>Bir sorun çıktı</h1>
      <p class="msg" id="errMsg"></p>
      <div class="actions">
        <button class="btn primary" id="retry">Tekrar dene</button>
        <button class="btn" id="logs">Günlük klasörünü aç</button>
        <button class="btn ghost" id="quit">Kapat</button>
      </div>
      <details class="log" open><summary>Son satırlar</summary><pre id="errLog"></pre></details>
    </section>
  </main>
  <script src="setup.js"></script>
</body>
</html>
